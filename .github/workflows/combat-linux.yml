name: Combat Linux verification

on:
  push:
    branches: [codex/neo-miami-polish]
    paths:
      - '.github/workflows/combat-linux.yml'
      - 'server/**'
      - 'tests/**'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/workflows/combat-linux.yml'
      - 'server/**'
      - 'tests/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # GitHub invokes explicit bash with -e -o pipefail.

concurrency:
  group: combat-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-combat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENABLE_PERSONALIZED_COMBAT: '1'
      VITE_COMBAT_ARENA: '1'
      GEMINI_API_KEY: ''
      ONNXRUNTIME_NODE_INSTALL: skip # CPU binaries are bundled; no optional GPU downloads.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Record platform
        run: |
          mkdir -p tests/.e2e-out/linux
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})' | tee tests/.e2e-out/linux/platform.json
          test "$(uname -s)" = Linux
      - run: npm ci
      - name: Build with native personalized combat enabled
        run: npm run build
      - name: Verify native startup and model integrity
        run: node tests/combat-deployment.mjs | tee tests/.e2e-out/linux/deployment.log
      - name: Exercise real CPU background removal
        run: node tests/combat-matting.mjs | tee tests/.e2e-out/linux/matting.log
      - name: Verify generated-character route and HTTP serving
        run: |
          node tests/personalized-generation-route.mjs | tee tests/.e2e-out/linux/generation-route.log
          node tests/server-http.mjs | tee tests/.e2e-out/linux/http.log
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: combat-linux-${{ github.sha }}
          path: |
            tests/.e2e-out/linux/
            tests/.e2e-out/combat-matting-report.json
          retention-days: 14
